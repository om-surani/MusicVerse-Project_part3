<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
    <pattern id="diag" width="40" height="40" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="transparent"/>
      <line x1="0" y1="0" x2="0" y2="40" stroke="rgba(255,255,255,0.06)" stroke-width="16"/>
    </pattern>
    <radialGradient id="vig" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.10)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.25)"/>
    </radialGradient>
  </defs>
  <rect width="400" height="400" fill="url(#g)"/>
  <rect width="400" height="400" fill="url(#diag)"/>
  <rect width="400" height="400" fill="url(#vig)"/>
  <circle cx="200" cy="175" r="95" fill="rgba(0,0,0,0.20)"/>
  <circle cx="200" cy="175" r="95" fill="none" stroke="rgba(255,255,255,0.30)" stroke-width="2"/>
  
    <g transform="translate(200,175)">
      <circle r="55" fill="#0b0b12"/>
      <circle r="45" fill="none" stroke="#2a2a3a" stroke-width="2"/>
      <circle r="35" fill="none" stroke="#2a2a3a" stroke-width="2"/>
      <circle r="25" fill="none" stroke="#2a2a3a" stroke-width="2"/>
      <circle r="16" fill="rgba(255,255,255,0.92)"/>
      <circle r="4" fill="#0b0b12"/>
    </g>
  <text x="200" y="358" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="26" font-weight="700" fill="rgba(255,255,255,0.95)"
        style="letter-spacing:1px;">R&amp;B</text>
</svg>
